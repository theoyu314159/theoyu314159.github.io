      <h1 id="git-初次設定教學"><a href="#git-初次設定教學" class="headerlink" title="git 初次設定教學"></a>git 初次設定教學</h1><p>github</p>
<h2 id="設定"><a href="#設定" class="headerlink" title="設定"></a>設定</h2><p>首先先讓你的電腦產生一個金鑰:</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">ssh-keygen -t ed25519 -C &quot;your_email@example.com&quot;</span><br></pre></td></tr></table></figure>
<p>輸入email，接著如果你想要每次ssh進去都要密碼的話就輸入，不想要的話就案space過去。<br>接著輸入:</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">cat ~/.ssh/id_ed25519.pub</span><br></pre></td></tr></table></figure>
<p>複製這裡的東西，然後進到github的設定，找到SSH Keys，新增一個，把複製的東西貼上去就沒問題了。<br><img src="https://i.meee.com.tw/GYi6Uh4.png" alt="add"></p>
