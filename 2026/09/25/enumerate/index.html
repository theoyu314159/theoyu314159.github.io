<h2 id="用法"><a href="#用法" class="headerlink" title="用法"></a>用法</h2><p>應該大家時常會需要重list當中一個一個將idx抽取出來的，普通的做法是:</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">for i in range(len(list)):</span><br><span class="line">    print(list[i])</span><br></pre></td></tr></table></figure>
<p>像這樣，但如果我們使用了enumerate就會回傳出(idx, value)，也可以分為兩個看:</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">for idx, vl in ebumerate(list):</span><br><span class="line">    print(idx, vl)</span><br></pre></td></tr></table></figure>
