          <div class="page-content"><h1 id="轉盤得分"><a href="#轉盤得分" class="headerlink" title="轉盤得分"></a>轉盤得分</h1><p>APCS歷屆</p>
<h2 id="題目"><a href="#題目" class="headerlink" title="題目"></a>題目</h2><p>看一下題目吧~<br><img src="https://i.meee.com.tw/PiTRGco.png" alt="pic"><br>題目要求我們模擬一個轉盤，會左右轉，就是將東西丟到左右的。</p>
<h2 id="解題"><a href="#解題" class="headerlink" title="解題"></a>解題</h2><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br></pre></td><td class="code"><pre><span class="line">#　把頭放到腳ｏｒ　放到頭</span><br><span class="line">from sys import stdin</span><br><span class="line">def right(t, string):</span><br><span class="line">    for i in range(t):</span><br><span class="line">        string.insert(0, string[-1])</span><br><span class="line">        string.pop()</span><br><span class="line">    return string</span><br><span class="line"></span><br><span class="line">def left(t, string):</span><br><span class="line">    for i in range(t):</span><br><span class="line">        string.append(string[0])</span><br><span class="line">        string.pop(0)</span><br><span class="line">    return string</span><br><span class="line"></span><br><span class="line">def cou():</span><br><span class="line">    global total</span><br><span class="line">    for i in range(n):</span><br><span class="line">        big = 0</span><br><span class="line">        last = 0</span><br><span class="line">        arr = []</span><br><span class="line">        for j in range(len(strings)):</span><br><span class="line">            arr.append(strings[j][i])</span><br><span class="line">        arr = sorted(arr)</span><br><span class="line">        #print(arr)</span><br><span class="line">        laststr = arr[0]</span><br><span class="line">        for j in arr:</span><br><span class="line">            if j == laststr:</span><br><span class="line">                big += 1</span><br><span class="line">            else:</span><br><span class="line">                last = max(last, big)</span><br><span class="line">                big = 1</span><br><span class="line">                laststr = j</span><br><span class="line">    #print(max(big, last))</span><br><span class="line">        total += max(big, last)</span><br><span class="line"></span><br><span class="line">#m, n, k = 3, 6, 2</span><br><span class="line">#strings = [list(&quot;apcsie&quot;), list(&quot;taiwan&quot;), list(&quot;icpeda&quot;)]</span><br><span class="line">#print(left(4, strings))</span><br><span class="line">m, n, k = map(int, stdin.readline().split())</span><br><span class="line">strings = []</span><br><span class="line">for i in range(m):</span><br><span class="line">    strings.append(list(input()))</span><br><span class="line"></span><br><span class="line">total = 0</span><br><span class="line">for i in range(k):</span><br><span class="line">    inp = list(map(int, stdin.readline().split()))</span><br><span class="line">    for j in range(m):</span><br><span class="line">        if inp[j] &lt; 0:</span><br><span class="line">            strings[j] = left(-inp[j], strings[j])</span><br><span class="line">        if inp[j] == 0:</span><br><span class="line">            pass</span><br><span class="line">        if inp[j] &gt; 0:</span><br><span class="line">            strings[j] = right(inp[j], strings[j])</span><br><span class="line">    cou()</span><br><span class="line">#n = 3</span><br><span class="line">#strings = [list(&quot;abc&quot;), list(&quot;abc&quot;), list(&quot;acb&quot;)]</span><br><span class="line">#print(strings)</span><br><span class="line">print(total)</span><br></pre></td></tr></table></figure>
<p>我的想法就是寫兩個function，固定用pop和insert, append等來做到從後面丟到前面的實作。</p>
